# Cổng chất lượng trên GitHub, cùng nội dung với scripts/check.sh (api + web) và thêm `next build`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (ruff + pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hangchon
          POSTGRES_PASSWORD: hangchon
          POSTGRES_DB: hangchon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hangchon -d hangchon"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      # tests/conftest.py tự tạo CSDL hangchon_test_<thư mục> trên máy chủ này
      TEST_PG_URL: postgresql+asyncpg://hangchon:hangchon@localhost:5432
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.14"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: uv sync
        run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: alembic heads (đúng một head)
        run: test "$(uv run alembic heads 2>/dev/null | grep -c '(head)')" = 1
      - name: pytest
        run: uv run pytest -p no:cacheprovider

  web:
    name: web (typecheck + lint + test + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      API_ORIGIN: http://localhost:8010
      SITE_URL: http://localhost:3010
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: bun install
        run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      - name: lint
        run: bun run lint
      - name: test
        run: bun run test
      - name: build
        run: bun run build
