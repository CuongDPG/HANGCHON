<!doctype html>
<!-- Trang tự viết, mô phỏng trang Amazon.co.jp: #productTitle, giá ở .a-offscreen, ảnh ở data-a-dynamic-image + "hiRes". -->
<html><head><title>Amazon.co.jp: 折りたたみ 物干し : ホーム＆キッチン</title></head><body>
<span id="productTitle"> 折りたたみ 物干し ステンレス 室内 </span>
<div id="corePriceDisplay_desktop_feature_div"><span class="a-price"><span class="a-offscreen">￥2,980</span></span></div>
<div class="a-price"><span class="a-offscreen">￥9,999</span></div>
<img id="landingImage" src="https://m.media-amazon.com/images/I/61Main._AC_SX300_.jpg"
  data-a-dynamic-image='{"https://m.media-amazon.com/images/I/61Main._AC_SL1500_.jpg":[1500,1500],"https://m.media-amazon.com/images/I/61Main._AC_SX300_.jpg":[300,300]}'>
<div id="altImages"><img src="https://m.media-amazon.com/images/I/71Alt._AC_US40_.jpg"><img src="https://m.media-amazon.com/images/G/09/sprite.png"></div>
<span id="acrPopover" title="5つ星のうち4.3"></span>
<span id="acrCustomerReviewText">1,234個の評価</span>
<a id="sellerProfileTriggerId" href="/gp/help/seller/at-a-glance.html?seller=A1">ほしもの商店</a>
<div id="productOverview_feature_div"><table><tr><td>素材</td><td>ステンレス</td></tr><tr><td>色</td><td>シルバー</td></tr></table></div>
<div id="feature-bullets"><ul><li>耐荷重 15kg</li><li>折りたたみ式</li></ul></div>
<div id="twister"><ul><li title="クリックして シルバー を選択"></li></ul></div>
<script>P.when('A').register("ImageBlockATF", function(A){ var data = {'colorImages': { 'initial': [{"hiRes":"https://m.media-amazon.com/images/I/81Hi._AC_SL1500_.jpg","large":"https://m.media-amazon.com/images/I/81Hi._AC_.jpg"}]}}; return data; });</script>
</body></html>
